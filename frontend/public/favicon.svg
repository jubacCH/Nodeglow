<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Nodeglow mark (concept E3, Glow Violet). Static asset: colours mirror
       design-tokens/tokens.json (accent dark #7C6CFF / light #5B4BE0). -->
  <style>
    .o { fill: none; stroke: #ECEEF2; }
    .s { fill: #ECEEF2; }
    .c, .h { fill: #7C6CFF; }
    .h { opacity: .3; }
    @media (prefers-color-scheme: light) {
      .o { stroke: #191B21; }
      .s { fill: #191B21; }
      .c, .h { fill: #5B4BE0; }
      .h { opacity: .2; }
    }
  </style>
  <circle class="h" cx="16" cy="16" r="10.5"/>
  <path class="o" d="M26.42 11.14A11.5 11.5 0 1 1 20.86 5.58" stroke-width="2.2" stroke-linecap="round"/>
  <circle class="s" cx="24.13" cy="7.87" r="2.4"/>
  <circle class="c" cx="16" cy="16" r="5"/>
</svg>
