# Nodeglow — source/development compose file: builds every image from this
# checkout. Installations that run from a git checkout (and update via
# `git pull` + build, NODEGLOW_UPDATE_MODE=git) use this file.
#
# To install a published release instead (pulls signed images from GHCR, no
# build, also air-gapped), use docker-compose.release.yml via scripts/install.sh
# — see docs/INSTALL.md. Keep both files in step.
services:
  db:
    image: postgres:16-alpine
    # Postgres ships defaults sized for a 1990s workstation: shared_buffers of
    # 128MB and work_mem of 4MB regardless of the machine. Overridable per
    # deployment; the defaults below suit a 4-8 GB host.
    command: >
      postgres
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
      -c work_mem=${POSTGRES_WORK_MEM:-8MB}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.max=5000
      -c pg_stat_statements.track=top
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nodeglow}
      POSTGRES_USER: ${POSTGRES_USER:-nodeglow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nodeglow}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: nodeglow-ch
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/nodeglow.xml:ro
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: nodeglow
      CLICKHOUSE_USER: nodeglow
      # Use separate CLICKHOUSE_PASSWORD if set, otherwise fall back to POSTGRES_PASSWORD
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nodeglow:
    build:
      context: ./backend
      # Enterprise features (ee/, Nodeglow Enterprise License) are built into
      # the same image: the Dockerfile copies this context to /opt/nodeglow-ee.
      # Remove this entry, or set NODEGLOW_DISABLE_EE=1 at runtime, for a
      # community-edition image/instance. Needs Docker Compose >= 2.17.
      additional_contexts:
        ee: ./ee
      args:
        # Opt in to bundling the proprietary Ookla speedtest CLI. Leave unset
        # for anything you distribute: Ookla's licence restricts redistribution
        # and commercial use. Set BUNDLE_OOKLA=1 in .env for your own install.
        BUNDLE_OOKLA: ${BUNDLE_OOKLA:-0}
        # Version shown in the UI/API. Source of truth is ./VERSION; the update
        # sidecar passes it automatically. For a manual build:
        #   APP_VERSION=$(head -n1 VERSION) docker compose build nodeglow
        APP_VERSION: ${APP_VERSION:-}
    container_name: nodeglow
    ports:
      # SYSLOG_BIND restricts the host address the syslog listeners bind to,
      # e.g. the management-VLAN IP. Default: all interfaces (as before).
      - "${SYSLOG_BIND:-0.0.0.0}:514:1514/udp"    # Syslog UDP (host 514 → container 1514)
      - "${SYSLOG_BIND:-0.0.0.0}:1514:1514/tcp"   # Syslog TCP
    expose:
      - "8000"             # Internal only — frontend proxies all requests
    volumes:
      - ./data:/data
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nodeglow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-nodeglow}
      CLICKHOUSE_URL: http://nodeglow:${CLICKHOUSE_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}@clickhouse:8123/nodeglow
      DATA_DIR: /data
      # Emergency escape hatch: "1" skips the alembic upgrade in entrypoint.sh.
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-}
      SYSLOG_PORT: "1514"
      UPDATE_SIDECAR_URL: http://updater:9100
      UPDATE_SIDECAR_TOKEN: ${UPDATE_SIDECAR_TOKEN:?Set UPDATE_SIDECAR_TOKEN in .env (shared with updater)}
      # Fernet/HMAC pepper. Provide via env for stronger separation from the
      # data volume. If unset, a key is auto-generated in DATA_DIR (see warning
      # in backend logs at startup).
      SECRET_KEY: ${SECRET_KEY:-}
      # Opt-in legacy escape hatch: when "1", the shared agent_enrollment_key
      # flow is still accepted alongside per-install tokens. Leave unset on
      # new deployments.
      NODEGLOW_ALLOW_SHARED_ENROLLMENT: ${NODEGLOW_ALLOW_SHARED_ENROLLMENT:-}
      # "1" runs the community edition even though ee/ is built in.
      NODEGLOW_DISABLE_EE: ${NODEGLOW_DISABLE_EE:-}
      # Enterprise license key, or a path to a file holding it (e.g.
      # /data/nodeglow-license.txt). Optional: admins can also install it
      # under Settings → License. See docs/OPERATIONS.md.
      NODEGLOW_LICENSE: ${NODEGLOW_LICENSE:-}
      # Logging: LOG_LEVEL=DEBUG|INFO|WARNING|ERROR, LOG_FORMAT=text|json.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    cap_add:
      - NET_RAW   # Required for ICMP ping
    # no-new-privileges is OFF here by default, unlike the frontend: ping runs
    # as the unprivileged nodeglow user and gets CAP_NET_RAW from a FILE
    # capability (setcap in the Dockerfile), which no-new-privileges disables.
    # iputils then falls back to unprivileged ICMP sockets, which only works if
    # net.ipv4.ping_group_range covers the container (Docker >= 20.10 sets it).
    # Set NODEGLOW_NO_NEW_PRIVILEGES=true after checking ICMP checks still work.
    security_opt:
      - "no-new-privileges:${NODEGLOW_NO_NEW_PRIVILEGES:-false}"
    # Optional resource ceiling (example values; size to your host):
    # mem_limit: 2g
    # cpus: 2.0
    restart: unless-stopped

  updater:
    build: ./sidecar
    container_name: nodeglow-updater
    volumes:
      - .:/opt/repo
      - /var/run/docker.sock:/var/run/docker.sock
      - backups:/backups
    environment:
      UPDATE_SIDECAR_TOKEN: ${UPDATE_SIDECAR_TOKEN:?Set UPDATE_SIDECAR_TOKEN in .env (shared with backend)}
      # This file builds from git, so the updater pulls + builds (git mode).
      # docker-compose.release.yml sets "image" instead.
      NODEGLOW_UPDATE_MODE: git
      # Postgres container to dump. Leave unset: the sidecar finds the `db`
      # service of the running compose project via its labels (this also works
      # when the stack was started under a different project name). Set it
      # only if that fails, e.g. DB_CONTAINER=nodeglow-db-1.
      DB_CONTAINER: ${DB_CONTAINER:-}
      # Host directory this stack runs from (e.g. /opt/nodeglow). Leave unset: it
      # is read from the running container's compose labels. Needed so that
      # ./data etc. resolve to the right HOST path when the updater recreates
      # containers; the update refuses to run if /data would move.
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-}
      POSTGRES_USER: ${POSTGRES_USER:-nodeglow}
      POSTGRES_DB: ${POSTGRES_DB:-nodeglow}
      BACKUP_DIR: /backups
      # Dumps kept per kind (pre-update and scheduled are counted separately).
      BACKUP_RETENTION: ${BACKUP_RETENTION:-5}
      # Scheduled Postgres dumps: "HH:MM" daily (UTC), "every 6h", or "off".
      # Empty = daily at 02:30 UTC. The dumps hold the database only, never
      # SECRET_KEY: escrow that separately (docs/OPERATIONS.md).
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-}
    expose:
      - "9100"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: nodeglow-frontend
    ports:
      # UI_BIND=127.0.0.1 when a reverse proxy on the same host terminates TLS,
      # so the plain-HTTP port is not reachable from the network.
      - "${UI_BIND:-0.0.0.0}:8000:3000"
    environment:
      HOSTNAME: "0.0.0.0"
    depends_on:
      - nodeglow
    security_opt:
      - no-new-privileges:true
    # mem_limit: 512m
    restart: unless-stopped

volumes:
  pgdata:
  chdata:
  backups:
