[pytest]
asyncio_mode = auto
# ../ee/backend/tests holds the enterprise tests. It is collected when the ee/
# directory is present (a missing testpath is skipped) and skips itself when
# NODEGLOW_DISABLE_EE=1, so the core suite can be run without ee:
#   NODEGLOW_DISABLE_EE=1 python -m pytest -q
testpaths = tests ../ee/backend/tests
