[package]
name = "nodeglow-agent"
version = "0.1.0"
edition = "2021"
description = "Nodeglow monitoring agent — lightweight, cross-platform system metrics collector"
license = "AGPL-3.0-only"
rust-version = "1.89"

[[bin]]
name = "nodeglow-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hostname = "0.4"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
chrono = { version = "0.4.38", features = ["serde"] }
anyhow = "1"
ed25519-dalek = "3"
# SSH client for deploying agents from a probe (part C). ring, not aws-lc-rs:
# no extra C toolchain for the static musl build; ring is already in via rustls.
# No "rsa": the rsa crate has an unfixed timing advisory (RUSTSEC-2023-0071);
# deploy logins and host keys use ed25519 or ecdsa.
russh = { version = "=0.65.1", default-features = false, features = ["ring"] }
# Sealed deploy logins: HPKE (RFC 9180) base mode, pure Rust.
hpke = { version = "0.13", default-features = false, features = ["x25519", "alloc"] }
zeroize = { version = "1", features = ["serde"] }
base64 = "0.22"
getrandom = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = "0.32"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1.19"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
