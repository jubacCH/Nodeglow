version: 2

# Weekly, grouped: one PR per ecosystem and week for minor/patch bumps, so the
# queue stays reviewable. Major bumps still arrive one per dependency, because
# each needs its own look (Next.js 14 -> 16, vitest 2 -> 5, ...).
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      # FastAPI 0.137+ nests included routers in app.routes, which blinds the
      # route-auth coverage test; 0.142+ also needs OpenTelemetry >=1.44.
      # Lift both together once that test walks the new router structure.
      - dependency-name: fastapi
        versions: [">=0.137"]
      - dependency-name: "opentelemetry-*"
      # 1.x replaced the thread-pool async client with aiohttp (extra
      # [async]) and broke production on 2026-10-10; upgrade deliberately,
      # tested against a real ClickHouse.
      - dependency-name: clickhouse-connect
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Planned migrations, not weekly bumps: Tailwind 4 rewrites the config,
      # and eslint-config-next has to match the Next.js major.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      # eslint-config-next 15 supports ESLint 8/9 only.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Types follow the Node runtime major (node:22 images, CI on 22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # sysinfo 0.33+ changed its API; the Windows build breaks until the
      # collectors are ported.
      - dependency-name: sysinfo
        versions: [">=0.33"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /sidecar
    schedule:
      interval: weekly
    groups:
      docker-base-images:
        patterns: ["*"]
    ignore:
      # Stay on Node LTS; odd majors (23, 25, ...) are short-lived.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
