name: Security

# Dependency and image vulnerability scans.
#
# All jobs are NON-BLOCKING for now (continue-on-error): every scanner reports
# a backlog of findings on the current dependency set, and failing every PR on
# that backlog would only teach people to ignore the check. The findings show
# up in the job logs and the run summary. Once the backlog is worked off, drop
# `continue-on-error` job by job to turn each scan into a gate.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new advisories against unchanged dependencies still surface.
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit backend/requirements.txt
        working-directory: backend
        run: pip-audit -r requirements.txt --desc on

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The lockfile is all npm audit needs; no install required.
      - name: Audit (high and above)
        run: npm audit --package-lock-only --audit-level=high

  cargo-audit:
    name: cargo audit (agent)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit agent/Cargo.lock
        run: cargo audit

  trivy:
    name: Trivy (backend image)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t nodeglow-backend:ci ./backend

      # Trivy is run from its container image at a pinned version rather than
      # through a floating action tag. Bump deliberately.
      - name: Scan image (HIGH/CRITICAL, fixable only)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --scanners vuln \
            nodeglow-backend:ci
