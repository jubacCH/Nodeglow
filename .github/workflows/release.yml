name: Release

# Builds, signs and publishes a release for a tag vX.Y.Z (or vX.Y.Z-pre).
#
#   1. prepare  VERSION must equal the tag; release notes from CHANGELOG.md
#   2. test     the full CI workflow, against the tagged commit
#   3. build    per image and platform, on a native runner (amd64 on
#               ubuntu-24.04, arm64 on ubuntu-24.04-arm, no QEMU): Trivy gate
#               (CRITICAL, fixable), then a push by digest with SBOM + provenance
#   4. images   per image: merge the platform digests into one manifest list
#               with the version tags, cosign keyless signature (recursive) and
#               a GitHub build attestation on the manifest list digest
#   5. bundle   offline bundle for air-gapped installs (amd64, enterprise image)
#   6. release  GitHub Release with notes, agent binaries, compose file,
#               install.sh, deploy archive, bundle and cosign-signed SHA256SUMS
#
# Cut a release with scripts/release.sh X.Y.Z, then push the tag. Manual runs
# (workflow_dispatch) must be started on the tag: "Use workflow from → Tags".
#
# Dry run (workflow_dispatch with dry_run = true, on any branch): runs CI,
# builds and pushes every platform image and the manifest lists, but only under
# the throwaway tag dryrun-<run id>. No version tags move, no bundle, no GitHub
# Release; the VERSION/tag check is skipped. Dry-run signatures carry a branch
# identity, which the updater and install.sh never accept.
#
# See docs/INSTALL.md, "For maintainers".

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and push all platform images as dryrun-<run id> only (no version tags, no release)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/jubacch
  # Pinned like in security.yml; bump deliberately.
  TRIVY_IMAGE: aquasec/trivy:0.58.1
  COSIGN_VERSION: v3.1.3

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      minor: ${{ steps.meta.outputs.minor }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7

      - name: Version from tag must match VERSION
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          file_version=$(sed -n '/^[[:space:]]*[^#[:space:]]/{p;q;}' VERSION | tr -d '[:space:]')
          if [ "$DRY_RUN" = "true" ]; then
            # Images only, under a throwaway tag; the version is what VERSION says.
            echo "::notice::Dry run on $REF_TYPE $TAG: images go to dryrun-$RUN_ID only, no release"
            {
              echo "version=$file_version"
              echo "tag=dryrun-$RUN_ID"
              echo "minor="
              echo "prerelease=true"
              echo "dry_run=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow on a tag (Use workflow from → Tags → vX.Y.Z), not on $REF_TYPE $TAG"
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag $TAG is not vX.Y.Z or vX.Y.Z-pre"
            exit 1
          fi
          version="${TAG#v}"
          if [ "$file_version" != "$version" ]; then
            echo "::error file=VERSION::VERSION says '$file_version' but the tag is $TAG — use scripts/release.sh"
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "tag=$TAG"
            echo "minor=$(printf '%s' "$version" | cut -d. -f1,2)"
            echo "prerelease=$prerelease"
            echo "dry_run=false"
          } >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        if: steps.meta.outputs.dry_run != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error file=CHANGELOG.md::No '## [$VERSION]' section in CHANGELOG.md — use scripts/release.sh"
            exit 1
          fi
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: steps.meta.outputs.dry_run != 'true'
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  test:
    name: CI
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # One job per image and platform, each on a native runner. The result is an
  # untagged image (platform manifest + its SBOM/provenance) pushed by digest;
  # the images job below merges and tags it.
  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    needs: [prepare, test]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write       # push the platform image by digest
    strategy:
      fail-fast: true
      matrix:
        platform:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
        image:
          # Default backend: includes ee/ (Nodeglow Enterprise License). The
          # enterprise features are inactive without a valid license; the rest
          # is the AGPL core. See docs/INSTALL.md, "Editions".
          - name: backend
            image: nodeglow-backend
            context: backend
            build-contexts: ee=ee
            licenses: AGPL-3.0-only AND LicenseRef-Nodeglow-Enterprise
            description: Nodeglow backend (core + enterprise features, license-gated)
          # Pure AGPL build: no ee/ named context → the Dockerfile's empty ee stage.
          - name: backend-community
            image: nodeglow-backend-community
            context: backend
            build-contexts: ""
            licenses: AGPL-3.0-only
            description: Nodeglow backend, community edition (AGPL only, no ee/)
          - name: frontend
            image: nodeglow-frontend
            context: frontend
            build-contexts: ""
            licenses: AGPL-3.0-only
            description: Nodeglow web UI
          # The deploy context bakes the release compose file + ClickHouse
          # config into the updater (image-mode updates install them).
          - name: updater
            image: nodeglow-updater
            context: sidecar
            build-contexts: deploy=dist/updater-context
            licenses: AGPL-3.0-only
            description: Nodeglow update and backup sidecar
    steps:
      - uses: actions/checkout@v7

      - name: Stage deploy files for the updater image
        if: matrix.image.name == 'updater'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          sh scripts/make-offline-bundle.sh --deploy-only --version "$VERSION" --out dist
          mkdir -p dist/updater-context
          cp -R "dist/nodeglow-$VERSION" dist/updater-context/deploy
          find dist/updater-context -type f

      - name: Build metadata
        id: build
        run: |
          {
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=$(git rev-parse --short=12 HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels and annotations
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image.image }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.licenses=${{ matrix.image.licenses }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.vendor=Nodeglow
          # Mirrors the labels; without it the action annotates with repository defaults.
          annotations: |
            org.opencontainers.image.title=${{ matrix.image.image }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.licenses=${{ matrix.image.licenses }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.vendor=Nodeglow

      # Gate first: a build for this runner's own platform, loaded into its
      # Docker for Trivy. Nothing is pushed if it fails. The cache makes the
      # push build below cheap.
      - name: Build for scanning (${{ matrix.platform.arch }})
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          build-contexts: ${{ matrix.image.build-contexts }}
          platforms: ${{ matrix.platform.platform }}
          load: true
          push: false
          tags: nodeglow-scan:${{ matrix.image.name }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            GIT_COMMIT=${{ steps.build.outputs.commit }}
            BUILD_DATE=${{ steps.build.outputs.date }}
            BUNDLE_OOKLA=0
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      # Same scanner and pin as security.yml, but blocking and CRITICAL only.
      # Accepted findings go into .trivyignore, each with a reason.
      - name: Trivy gate (CRITICAL, fixable)
        env:
          IMAGE: nodeglow-scan:${{ matrix.image.name }}
        run: |
          set -eu
          ignore=""
          if [ -f .trivyignore ]; then ignore="--ignorefile /src/.trivyignore"; fi
          # shellcheck disable=SC2086
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/src:ro" \
            "$TRIVY_IMAGE" image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --scanners vuln $ignore \
            "$IMAGE"

      - name: Build and push by digest (${{ matrix.platform.platform }})
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          build-contexts: ${{ matrix.image.build-contexts }}
          platforms: ${{ matrix.platform.platform }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.image.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            GIT_COMMIT=${{ steps.build.outputs.commit }}
            BUILD_DATE=${{ steps.build.outputs.date }}
            BUNDLE_OOKLA=0
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          PLATFORM: ${{ matrix.platform.platform }}
        run: |
          set -eu
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::the push reported no digest"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "$PLATFORM: $DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform.arch }}-${{ matrix.image.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Per image: one manifest list from the platform digests, tagged, signed and
  # attested. The tag points at this list; its digest is what cosign signs and
  # what the updater and install.sh verify and pin.
  images:
    name: Image ${{ matrix.name }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write       # push the manifest list, signatures, attestations
      id-token: write       # cosign keyless + attestation signing (OIDC)
      attestations: write   # GitHub build provenance attestation
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            image: nodeglow-backend
            licenses: AGPL-3.0-only AND LicenseRef-Nodeglow-Enterprise
            description: Nodeglow backend (core + enterprise features, license-gated)
          - name: backend-community
            image: nodeglow-backend-community
            licenses: AGPL-3.0-only
            description: Nodeglow backend, community edition (AGPL only, no ee/)
          - name: frontend
            image: nodeglow-frontend
            licenses: AGPL-3.0-only
            description: Nodeglow web UI
          - name: updater
            image: nodeglow-updater
            licenses: AGPL-3.0-only
            description: Nodeglow update and backup sidecar
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Arch first: digests-backend-* would also match backend-community.
          pattern: digests-*-${{ matrix.name }}
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and annotations
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }},enable=${{ needs.prepare.outputs.dry_run == 'true' }}
            type=raw,value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.dry_run != 'true' }}
            type=raw,value=${{ needs.prepare.outputs.minor }},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
          # Index annotations; without this input the action would annotate
          # the list with the repository defaults.
          annotations: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.vendor=Nodeglow

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
        run: |
          set -euo pipefail
          count=$(find . -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 platform digests for $IMAGE, got $count"
            exit 1
          fi
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done \
            < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect manifest list
        id: list
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$TAG"
          digest=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          platforms=$(docker buildx imagetools inspect "$TAG" --raw \
            | jq -r '.manifests[] | select(.platform.os != "unknown") | .platform.os + "/" + .platform.architecture' \
            | sort | tr '\n' ' ')
          echo "manifest list $TAG → $digest, platforms: $platforms"
          for want in linux/amd64 linux/arm64; do
            case " $platforms" in
              *" $want "*) ;;
              *) echo "::error::$TAG has no $want manifest"; exit 1 ;;
            esac
          done
          case "$digest" in
            sha256:*) echo "digest=$digest" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::no digest for $TAG"; exit 1 ;;
          esac

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Keyless: the certificate binds the signature to this workflow file and
      # the tag ref (identity .../release.yml@refs/tags/vX.Y.Z). The updater and
      # install.sh verify exactly that identity, on the manifest list the tag
      # points to; --recursive also signs each platform manifest.
      # Retried: when Rekor answers slowly, cosign's own HTTP retry of an entry
      # that did get logged fails with 409 createLogEntryConflict. A new
      # attempt uses fresh ephemeral keys, so its entries never conflict.
      - name: Sign with cosign
        env:
          REF: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.list.outputs.digest }}
        run: |
          set -eu
          for attempt in 1 2 3; do
            if cosign sign --yes --recursive "$REF"; then exit 0; fi
            echo "::warning::cosign sign attempt $attempt failed"
            sleep $((attempt * 15))
          done
          echo "::error::cosign sign failed 3 times for $REF"
          exit 1

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          subject-digest: ${{ steps.list.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          DIGEST: ${{ steps.list.outputs.digest }}
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### $IMAGE"
            echo '```'
            echo "$TAGS"
            echo "digest: $DIGEST (linux/amd64 + linux/arm64)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Release only: a dry run has no release tag whose signatures could be
  # verified for the bundle.
  bundle:
    name: Offline bundle
    needs: [prepare, images]
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    outputs:
      bundled: ${{ steps.size.outputs.bundled }}
    steps:
      - uses: actions/checkout@v7

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The images were just signed; --require-signature proves the bundle
      # carries exactly the signed images.
      - name: Build offline bundle (amd64, enterprise image)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sh scripts/make-offline-bundle.sh --version "$VERSION" \
            --platform linux/amd64 --edition enterprise --require-signature --out dist

      # GitHub release assets are limited to 2 GiB each. Above ~1.9 GiB the
      # bundle is not attached; operators build it with the script instead.
      - name: Check size
        id: size
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          file="dist/nodeglow-$VERSION-offline-amd64.tar.gz"
          bytes=$(stat -c %s "$file")
          echo "bundle: $file, $((bytes / 1024 / 1024)) MiB" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -lt 2040109465 ]; then
            echo "bundled=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Offline bundle exceeds the release asset limit; not attached (build it with scripts/make-offline-bundle.sh)"
            rm -f "$file"
          fi

      - uses: actions/upload-artifact@v7
        if: steps.size.outputs.bundled == 'true'
        with:
          name: offline-bundle
          path: dist/nodeglow-*-offline-amd64.tar.gz
          retention-days: 3
          compression-level: 0

  release:
    name: GitHub Release
    needs: [prepare, images, bundle]
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload assets
      id-token: write   # cosign sign-blob (keyless)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes

      - uses: actions/download-artifact@v8
        if: needs.bundle.outputs.bundled == 'true'
        with:
          name: offline-bundle
          path: dist

      - name: Collect assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          sh scripts/make-offline-bundle.sh --deploy-only --version "$VERSION" --out build
          cp "build/nodeglow-$VERSION-deploy.tar.gz" dist/
          cp docker-compose.release.yml dist/docker-compose.release.yml
          cp scripts/install.sh dist/install.sh
          # The agent binaries are the ones committed by agent-build.yml at
          # this tag — the same files the backend image serves to agents.
          cp backend/static/nodeglow-agent-linux dist/nodeglow-agent-linux-x86_64
          cp backend/static/nodeglow-agent.exe dist/nodeglow-agent-windows-x86_64.exe
          # Their release signatures (P2a), published outside the SaaS so a
          # customer can check a binary before installing it. A tag whose
          # binaries are unsigned dev builds is not released.
          for sig in nodeglow-agent-linux.sig nodeglow-agent.exe.sig; do
            if [ ! -f "backend/static/$sig" ]; then
              echo "::error::backend/static/$sig is missing: the agent binaries at this tag are not release-signed" >&2
              exit 1
            fi
          done
          cp backend/static/nodeglow-agent-linux.sig dist/nodeglow-agent-linux-x86_64.sig
          cp backend/static/nodeglow-agent.exe.sig dist/nodeglow-agent-windows-x86_64.exe.sig
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign SHA256SUMS
        working-directory: dist
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          BUNDLED: ${{ needs.bundle.outputs.bundled }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          notes=notes/release-notes.md
          {
            echo
            echo "---"
            echo
            echo "### Install"
            echo
            echo '```sh'
            echo "curl -fsSLO https://github.com/$REPO/releases/download/$TAG/install.sh"
            echo "sudo sh install.sh --version $VERSION"
            echo '```'
            echo
            echo "Images (linux/amd64 + linux/arm64, cosign-signed, SBOM + provenance):"
            echo
            for img in nodeglow-backend nodeglow-backend-community nodeglow-frontend nodeglow-updater; do
              echo "- \`$IMAGE_PREFIX/$img:$VERSION\`"
            done
            echo
            if [ "$BUNDLED" = "true" ]; then
              echo "Air-gapped: \`nodeglow-$VERSION-offline-amd64.tar.gz\` → \`sh install.sh --offline <bundle>\`; for arm64 build it with \`scripts/make-offline-bundle.sh --version $VERSION --platform linux/arm64\`."
            else
              echo "Air-gapped: build the offline bundle with \`scripts/make-offline-bundle.sh --version $VERSION\`."
            fi
            echo "Verify downloads and images: [docs/INSTALL.md](https://github.com/$REPO/blob/$TAG/docs/INSTALL.md#verifying-signatures)."
          } >> "$notes"

          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; else flags="--latest"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of a release: replace the assets, keep the release.
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" dist/* --verify-tag $flags \
              --title "Nodeglow $VERSION" --notes-file "$notes"
          fi
