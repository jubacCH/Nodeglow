name: Build Rust Agent

on:
  push:
    paths:
      - "agent/**"
      - ".github/workflows/agent-build.yml"
      - "tools/agent-release-key/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # musl, not gnu: a glibc-linked binary only runs on distributions
          # with at least the builder's glibc. ubuntu-latest ships 2.39, which
          # excluded Debian 12 (2.36) and Ubuntu 22.04 (2.35) — the agent failed
          # to start on them with "GLIBC_2.39 not found". musl links statically
          # and runs anywhere.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: nodeglow-agent-linux
            binary: nodeglow-agent
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nodeglow-agent.exe
            binary: nodeglow-agent.exe

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v7

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test
        run: cargo test --release --target ${{ matrix.target }}

      - name: Verify the Linux binary is static
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -e
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          file "$BIN"

          # Ask file(1), not ldd: its wording for a static binary varies between
          # systems ("statically linked" vs "not a dynamic executable"), which
          # made an earlier version of this check reject a perfectly static
          # build.
          if ! file "$BIN" | grep -qE "static-pie linked|statically linked"; then
            echo "agent binary is not statically linked — it will not run on older distributions" >&2
            ldd "$BIN" || true
            exit 1
          fi

          # The actual regression to guard against: any glibc version requirement
          # limits which distributions can run the agent.
          if strings "$BIN" | grep -q "GLIBC_"; then
            echo "agent binary still references GLIBC symbols" >&2
            strings "$BIN" | grep -o "GLIBC_[0-9.]*" | sort -u >&2
            exit 1
          fi

      - name: Rename binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}
          ls -lh ${{ matrix.artifact }}
          sha256sum ${{ matrix.artifact }} || certutil -hashfile ${{ matrix.artifact }} SHA256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: agent/${{ matrix.artifact }}
          retention-days: 90

  # Release signing (spec 2026-10-11 rule 4, P2a). Signs both binaries with
  # the release key from the secret AGENT_RELEASE_SIGNING_KEY (Ed25519,
  # PKCS#8 PEM, or that PEM base64-encoded) — see tools/agent-release-key/.
  # Without the secret (forks, PRs from forks) the job still passes and marks
  # the artifact as an unsigned dev build.
  sign:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: nodeglow-agent-linux
          path: dist/

      - name: Download Windows binary
        uses: actions/download-artifact@v8
        with:
          name: nodeglow-agent.exe
          path: dist/

      - name: Sign with the release key
        id: sign
        env:
          AGENT_RELEASE_SIGNING_KEY: ${{ secrets.AGENT_RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AGENT_RELEASE_SIGNING_KEY:-}" ]; then
            msg="AGENT_RELEASE_SIGNING_KEY is not set: these are UNSIGNED DEV BUILDS. Agents that require release signatures (probes, multi-tenant) refuse them."
            echo "::warning title=Unsigned agent build::$msg"
            printf '%s\n' "UNSIGNED DEV BUILD - not release-signed." "$msg" > dist/UNSIGNED-DEV-BUILD.txt
            { echo "### Agent binaries: UNSIGNED DEV BUILD"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          umask 077
          key="$RUNNER_TEMP/agent-release-key.pem"
          trap 'rm -f "$key"' EXIT
          if printf '%s' "$AGENT_RELEASE_SIGNING_KEY" | grep -q -- "-----BEGIN PRIVATE KEY-----"; then
            printf '%s\n' "$AGENT_RELEASE_SIGNING_KEY" > "$key"
          else
            printf '%s' "$AGENT_RELEASE_SIGNING_KEY" | tr -d ' \r\n' | base64 -d > "$key"
          fi

          read -r pub kid < <(sh tools/agent-release-key/sign.sh pubkey "$key")
          echo "Release key id: $kid"
          # Sign only with a key the binaries themselves trust: agents built
          # from this commit verify their next update against release_keys.rs.
          if ! grep -q "\"$pub\"" agent/src/release_keys.rs; then
            echo "::error title=Release key not compiled in::The public key of AGENT_RELEASE_SIGNING_KEY ($pub, id $kid) is not in agent/src/release_keys.rs. Paste it there first (tools/agent-release-key/README.md)."
            exit 1
          fi

          sh tools/agent-release-key/sign.sh sign "$key" linux dist/nodeglow-agent-linux
          sh tools/agent-release-key/sign.sh sign "$key" windows dist/nodeglow-agent.exe
          sh tools/agent-release-key/sign.sh verify "$key" dist/nodeglow-agent-linux
          sh tools/agent-release-key/sign.sh verify "$key" dist/nodeglow-agent.exe
          { echo "### Agent binaries: release-signed (key $kid)"; echo; echo '```'; cat dist/*.sig; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.sign.outputs.signed == 'true' && 'nodeglow-agent-release-signed' || 'nodeglow-agent-UNSIGNED-dev-build' }}
          path: dist/
          retention-days: 90

  # Commits the binaries (and their release signatures) to main, where the
  # backend image picks them up. Never runs for any other ref: a run on a
  # branch (push or workflow_dispatch) builds, tests and signs only.
  release:
    needs: [build, sign]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.sign.outputs.signed == 'true' && 'nodeglow-agent-release-signed' || 'nodeglow-agent-UNSIGNED-dev-build' }}
          path: dist/

      - name: Refuse unsigned binaries on the canonical repository
        if: needs.sign.outputs.signed != 'true' && github.repository == 'jubacCH/Nodeglow'
        run: |
          # An unsigned agent on main would be served to every installation;
          # one built while release_keys.rs holds only the placeholder can
          # never verify a release signature, so agents that require one
          # (probes, multi-tenant) would be stuck on it for good. Forks keep
          # committing their unsigned dev builds.
          echo "::error title=Release key missing::AGENT_RELEASE_SIGNING_KEY is not set - not committing unsigned agent binaries to main. See tools/agent-release-key/README.md."
          exit 1

      - name: Copy to backend static (for auto-update serving)
        run: |
          set -e
          mkdir -p backend/static
          cp dist/nodeglow-agent-linux backend/static/nodeglow-agent-linux
          cp dist/nodeglow-agent.exe backend/static/nodeglow-agent.exe
          chmod +x backend/static/nodeglow-agent-linux
          if [ -f dist/nodeglow-agent-linux.sig ] && [ -f dist/nodeglow-agent.exe.sig ]; then
            cp dist/nodeglow-agent-linux.sig backend/static/nodeglow-agent-linux.sig
            cp dist/nodeglow-agent.exe.sig backend/static/nodeglow-agent.exe.sig
          else
            # Unsigned (fork): never leave a signature of older bytes behind.
            rm -f backend/static/nodeglow-agent-linux.sig backend/static/nodeglow-agent.exe.sig
          fi
          ls -lh dist/ backend/static/nodeglow-agent*

      - name: Commit updated binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A backend/static
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: update Rust agent binaries [skip ci]"
            git push origin main
          fi
