name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs the whole suite against the tagged commit before it
  # builds anything.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Core + enterprise (ee/backend/tests is collected via pytest.ini).
      - name: Run tests
        run: pytest -q

      # The open-core promise: the core passes on its own. The loader ignores
      # ee/ and the ee tests skip themselves.
      - name: Run tests without ee (community edition)
        env:
          NODEGLOW_DISABLE_EE: "1"
        run: pytest -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.17.0

      # The rule set in backend/ruff.toml is a ratchet: bug-class checks only,
      # green on the current code. Widen it one rule family at a time.
      - name: Ruff (backend)
        working-directory: backend
        run: ruff check --output-format github .

      - name: Ruff (ee backend)
        run: ruff check --config backend/ruff.toml --output-format github ee/backend

      - name: Ruff (sidecar)
        run: ruff check --config backend/ruff.toml --output-format github sidecar

      # Catches interpolation/schema mistakes in docker-compose.yml before an
      # operator's `compose up` does. Dummy values satisfy the :? guards.
      - name: docker compose config
        env:
          POSTGRES_PASSWORD: ci
          UPDATE_SIDECAR_TOKEN: ci
        run: |
          set -eu
          docker compose -f docker-compose.yml config --quiet
          # An existing .env (no POSTGRES_APP_USER) keeps one database user
          # for app and migrations; a new one (install.sh) splits them.
          old=$(docker compose -f docker-compose.yml config)
          new=$(POSTGRES_APP_USER=nodeglow_app POSTGRES_APP_PASSWORD=app \
            docker compose -f docker-compose.yml config)
          echo "$old" | grep -F 'DATABASE_URL: postgresql+asyncpg://nodeglow:ci@db:5432/nodeglow'
          echo "$old" | grep -F 'NODEGLOW_COMPOSE_OWNER_URL: postgresql+asyncpg://nodeglow:ci@db:5432/nodeglow'
          echo "$new" | grep -F 'DATABASE_URL: postgresql+asyncpg://nodeglow_app:app@db:5432/nodeglow'
          echo "$new" | grep -F 'POSTGRES_APP_USER: nodeglow_app'

      # The release compose file (image mode) must render as well, for both
      # editions, and both files must define the same services.
      - name: docker compose config (release)
        env:
          POSTGRES_PASSWORD: ci
          UPDATE_SIDECAR_TOKEN: ci
          NODEGLOW_VERSION: 0.0.0-ci
        run: |
          set -eu
          docker compose -f docker-compose.release.yml config --quiet
          NODEGLOW_BACKEND_IMAGE=nodeglow-backend-community \
            docker compose -f docker-compose.release.yml config --quiet
          src=$(docker compose -f docker-compose.yml config --services | sort)
          rel=$(docker compose -f docker-compose.release.yml config --services | sort)
          if [ "$src" != "$rel" ]; then
            echo "::error::docker-compose.yml and docker-compose.release.yml define different services"
            printf 'source:\n%s\nrelease:\n%s\n' "$src" "$rel"
            exit 1
          fi

      # install.sh runs on customer hosts with whatever /bin/sh they have.
      - name: shellcheck (scripts)
        run: shellcheck -s sh scripts/*.sh

  sidecar:
    name: Sidecar (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests -q

  # The unit tests mock ClickHouse. This job talks to a real server, so a
  # client-library change that breaks the connection fails here, not in
  # production (clickhouse-connect 1.x, 2026-10-10).
  clickhouse-live:
    name: ClickHouse (live)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # Started after the checkout (not as a service container) so it runs
      # with the production config and init.sql, and with the user setup of
      # docker-compose.yml (a named user with access management — the
      # tenancy tests create a restricted user and row policies).
      - name: Start ClickHouse
        working-directory: .
        run: |
          docker run -d --name clickhouse -p 8123:8123 \
            -e CLICKHOUSE_DB=nodeglow \
            -e CLICKHOUSE_USER=nodeglow \
            -e CLICKHOUSE_PASSWORD=nodeglow \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            -v "$PWD/clickhouse/config.xml:/etc/clickhouse-server/config.d/nodeglow.xml:ro" \
            -v "$PWD/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro" \
            clickhouse/clickhouse-server:24.8

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Wait for ClickHouse
        run: |
          # The entrypoint runs init.sql on a temporary server bound to the
          # container's loopback; the published port answers once the real
          # server (with the application user) is up.
          for i in $(seq 1 60); do
            curl -fsS "http://localhost:8123/?user=nodeglow&password=nodeglow" \
              --data-binary "SELECT 1" 2>/dev/null | grep -q 1 && exit 0
            sleep 2
          done
          docker logs clickhouse || true
          echo "::error::ClickHouse did not come up"; exit 1

      - name: Run live ClickHouse tests
        env:
          NODEGLOW_TEST_CLICKHOUSE_URL: http://nodeglow:nodeglow@localhost:8123/nodeglow
        run: pytest -q tests/test_live_clickhouse.py -rs

  migrations:
    name: Migrations (alembic + entrypoint)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nodeglow
          POSTGRES_USER: nodeglow
          POSTGRES_PASSWORD: nodeglow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodeglow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: fresh install builds the schema and stamps head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://nodeglow:nodeglow@localhost:5432/nodeglow
          SECRET_KEY: ci-secret-key
          # config.py creates DATA_DIR on import; the default /data is not
          # writable for the runner user.
          DATA_DIR: ${{ runner.temp }}/nodeglow-data
        run: |
          set -e
          python migrate.py
          # The agents table exists only in the models, never in a migration —
          # a plain `alembic upgrade head` on an empty database fails on it.
          psql "postgresql://nodeglow:nodeglow@localhost:5432/nodeglow" \
            -tAc "SELECT to_regclass('public.agents')" | grep -q agents
          psql "postgresql://nodeglow:nodeglow@localhost:5432/nodeglow" \
            -tAc "SELECT version_num FROM alembic_version" | grep -qE '^[0-9]+$'

      - name: migrations alone can build the schema from nothing
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://nodeglow:nodeglow@localhost:5432/migchain
          SECRET_KEY: ci-secret-key
          DATA_DIR: ${{ runner.temp }}/nodeglow-data
        run: |
          set -e
          # A second, untouched database: this proves the migration chain is
          # self-sufficient, which is what makes the schema reproducible rather
          # than a by-product of create_all().
          PGPASSWORD=nodeglow createdb -h localhost -U nodeglow migchain
          alembic -c alembic.ini upgrade head

      - name: models and migrations agree (no silent schema drift)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://nodeglow:nodeglow@localhost:5432/migchain
          SECRET_KEY: ci-secret-key
          DATA_DIR: ${{ runner.temp }}/nodeglow-data
        run: |
          # Fails when a model changed without a matching migration — the exact
          # way schema drift is introduced: fresh installs get the change via
          # create_all(), existing installs never do.
          alembic -c alembic.ini check

      - name: running it again is idempotent (existing-install path)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://nodeglow:nodeglow@localhost:5432/nodeglow
          SECRET_KEY: ci-secret-key
          DATA_DIR: ${{ runner.temp }}/nodeglow-data
        run: python migrate.py

      # Tenancy migrations and PostgreSQL row-level security (multi-tenancy
      # phase 7): upgrade paths, RLS enabled and forced on every tenant
      # table, raw SQL as nodeglow_app, and a subset of the router tests
      # running as the app role with RLS on. The service's pg_hba uses
      # scram-sha-256, so the app role's password is checked for real.
      - name: tenancy and row-level security on PostgreSQL
        working-directory: backend
        env:
          NODEGLOW_PG_TEST_URL: postgresql://nodeglow:nodeglow@localhost:5432/postgres
          SECRET_KEY: ci-secret-key
          DATA_DIR: ${{ runner.temp }}/nodeglow-data
        run: python -m pytest -q -rs tests/test_migrations_tenancy_pg.py tests/test_pg_rls.py tests/test_tenant_keys_pg.py

      - name: entrypoint runs migrations and honours SKIP_MIGRATIONS
        working-directory: backend
        run: |
          set -e
          sudo mkdir -p /data && sudo chown -R "$USER" /data
          export DATA_DIR="${{ runner.temp }}/nodeglow-data"
          mkdir -p /tmp/stub
          printf '#!/bin/sh\nshift\nexec "$@"\n' > /tmp/stub/gosu
          printf '#!/bin/sh\necho MIGRATE_RAN\n' > /tmp/stub/python
          chmod +x /tmp/stub/gosu /tmp/stub/python

          PATH=/tmp/stub:$PATH sh entrypoint.sh echo APP_STARTED > with.log
          grep -q MIGRATE_RAN with.log
          grep -q APP_STARTED with.log

          PATH=/tmp/stub:$PATH SKIP_MIGRATIONS=1 sh entrypoint.sh echo APP_STARTED > without.log
          # Not `! grep`: a negated command never trips `set -e`.
          if grep -q MIGRATE_RAN without.log; then
            echo "entrypoint migrated despite SKIP_MIGRATIONS=1" >&2
            exit 1
          fi
          grep -q APP_STARTED without.log

          printf '#!/bin/sh\nexit 1\n' > /tmp/stub/python
          if PATH=/tmp/stub:$PATH sh entrypoint.sh echo APP_STARTED; then
            echo "entrypoint started the app despite a failed migration" >&2
            exit 1
          fi

  frontend:
    name: Frontend (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # TODO: make this blocking once the ESLint config has landed and the
      # existing findings are cleaned up.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

